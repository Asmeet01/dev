name: Secure DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ asmeet ]
  pull_request:
    branches: [ asmeet ]

jobs:
  # Stage 1: Static Application Security Testing (SAST)
  sast_scan:
    name: SAST Scan (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Stage 2: Software Composition Analysis (SCA)
  dependency_scan:
    name: Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format small

  # Stage 3: Docker Build and Container Scan
  container_security:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [sast_scan, dependency_scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t devsecops-demo-app:${{ github.sha }} .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-demo-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0' # We want to report vulnerabilities but not fail the build for this lab
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        if: success()
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image to Docker Hub
        if: success()
        run: |
          docker tag devsecops-demo-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-demo-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-demo-app:latest
